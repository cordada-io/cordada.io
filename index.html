<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width,initial-scale=1,viewport-fit=cover"
      name="viewport"
    />
    <title>Cordada</title>
    <meta
      content="Cordada - Building AI first reliable software solutions"
      name="description"
    />
    <meta
      content="#141224"
      name="theme-color"
    />
    <meta
      content="Cordada"
      property="og:title"
    />
    <meta
      content="website"
      property="og:type"
    />
    <meta
      content="Cordada - Building AI first reliable software solutions"
      property="og:description"
    />
    <meta
      content="https://cordada.io/"
      property="og:url"
    />
    <meta
      content="https://cordada.io/assets/icon-512x512.png"
      property="og:image"
    />
    <meta
      content="summary"
      name="twitter:card"
    />
    <meta
      content="@cordadaio"
      name="twitter:site"
    />
    <link
      href="assets/icon-512x512.png"
      rel="icon"
    />
    <link
      as="font"
      crossorigin
      href="assets/CascadiaCode.woff2"
      rel="preload"
      type="font/woff2"
    />
    <link
      as="font"
      crossorigin
      href="assets/UncutSans-Regular.woff2"
      rel="preload"
      type="font/woff2"
    />
    <link
      as="font"
      crossorigin
      href="assets/UncutSans-Medium.woff2"
      rel="preload"
      type="font/woff2"
    />
    <link
      href="css/site.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main
      id="screen"
      aria-live="polite"
    >
      <noscript>
        <div class="page">
          <h1 class="title">Cordada</h1>
          <div class="prose">
            <p class="lede">Software fiable con la IA en el centro.</p>
            <p>
              Construimos <a href="https://enrutar.com">enrutar</a>: planificación inteligente de
              rutas y gestión de trabajos para profesionales de servicios técnicos.
            </p>
            <p><a href="mailto:hello@cordada.io">hello@cordada.io</a></p>
          </div>
        </div>
      </noscript>
    </main>

    <footer class="bar">
      <a
        class="home"
        aria-label="Cordada home"
        data-route="home"
        href="#/"
      ></a>
      <nav aria-label="Main">
        <a
          data-route="projects"
          href="#/projects"
          >projects</a
        ><span
          class="sep"
          aria-hidden="true"
        ></span
        ><a
          data-route="contact"
          href="#/contact"
          >contact</a
        >
      </nav>
      <div class="right">
        <span
          class="lang"
          aria-label="Idioma / Language"
          role="group"
          ><button
            data-lang="en"
            lang="en"
            type="button"
          >
            en
          </button>
          <span
            class="sep"
            aria-hidden="true"
          ></span>
          <button
            data-lang="es"
            lang="es"
            type="button"
          >
            es
          </button></span
        >
        <button
          id="snd"
          aria-pressed="false"
          type="button"
        >
          ♪ sound off
        </button>
      </div>
    </footer>

    <script src="js/logo.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
